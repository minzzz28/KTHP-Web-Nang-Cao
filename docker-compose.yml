services:
  mysql:
    image: mysql:8.4
    container_name: student-rental-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env and set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Copy .env.example to .env and set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # The checked-in legacy snapshot is imported only when this named volume
      # is first created.  The .dump suffix prevents the image entrypoint from
      # executing it a second time after the initializer chooses the database.
      - ./server/database.sql:/docker-entrypoint-initdb.d/10-student-rental.dump:ro
      - ./server/docker/init-database.sh:/docker-entrypoint-initdb.d/20-import-student-rental.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
